<div id="spa-view-content">
  <div id="group-purchases" class="content-section active">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">
                    <i class="bi bi-people"></i> Compras Grupales
                </h2>
                <button class="btn btn-primary" onclick="showCreateGroupPurchaseModal()">
                    <i class="bi bi-plus"></i> Nueva Compra Grupal
                </button>
            </div>

            <!-- Filters -->
            <div class="card mb-4">
                <div class="card-body py-2">
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <!-- Estado -->
                        <div class="d-flex align-items-center gap-1 flex-grow-1" style="min-width:140px">
                            <label class="form-label mb-0 text-nowrap small fw-semibold">Estado</label>
                            <select class="form-select form-select-sm" id="groupPurchaseStatusFilter">
                                <option value="">Todos</option>
                                <option value="PENDING">Pendiente</option>
                                <option value="PARTIAL">Parcial</option>
                                <option value="COMPLETED">Completada</option>
                                <option value="CANCELLED">Cancelada</option>
                            </select>
                        </div>
                        <!-- Desde -->
                        <div class="d-flex align-items-center gap-1">
                            <label class="form-label mb-0 text-nowrap small fw-semibold">Desde</label>
                            <input type="date" class="form-control form-control-sm" id="groupPurchaseStartDateFilter">
                        </div>
                        <!-- Hasta -->
                        <div class="d-flex align-items-center gap-1">
                            <label class="form-label mb-0 text-nowrap small fw-semibold">Hasta</label>
                            <input type="date" class="form-control form-control-sm" id="groupPurchaseEndDateFilter">
                        </div>
                        <!-- Botón -->
                        <button class="btn btn-primary btn-sm" onclick="filterGroupPurchases()">
                            <i class="bi bi-funnel"></i> Filtrar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Group Purchases Table -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover" id="groupPurchasesTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Total</th>
                                    <th>Participantes</th>
                                    <th>Estado</th>
                                    <th>Fecha</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="6" class="text-center text-muted">
                                        Cargando compras grupales...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
  <script>
    window.initGroupPurchasesView = function() { if (typeof loadGroupPurchases === 'function') loadGroupPurchases(); };
  </script>
</div>
