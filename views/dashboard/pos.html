<div id="spa-view-content">
<style data-dash-spa-style>
/* ══ POS Layout ══════════════════════════════════════════════════════════ */
#pos-view {
    display: grid;
    grid-template-columns: 1fr 370px;
    gap: 16px;
    height: calc(100vh - 110px);
    overflow: hidden;
}
#pos-left {
    overflow-y: auto;
    min-height: 0;
    padding-right: 2px;
}
#pos-left::-webkit-scrollbar { width: 4px; }
#pos-left::-webkit-scrollbar-track { background: transparent; }
#pos-left::-webkit-scrollbar-thumb { background: var(--th-border2); border-radius: 4px; }
#pos-right {
    display: flex;
    flex-direction: column;
    min-height: 0;
}
#posCartPanel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--th-surf);
    border: 1px solid var(--th-border);
    border-radius: 18px;
    box-shadow: 0 8px 32px rgba(0,0,0,.18);
    overflow: hidden;
    min-height: 0;
}
/* Ocultar burbuja flotante y barra inferior en POS */
#pos-view ~ * #sellCartBottomBar,
body.sell-cart-bar-visible #sellCartBottomBar { display: none !important; }
#spa-view-content #sellCartBubble { display: none !important; }
/* Products header in POS */
#pos-left .pos-section-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 800; color: var(--th-text2);
    text-transform: uppercase; letter-spacing: .07em;
    margin-bottom: 10px;
}
@media (max-width: 991px) {
    #pos-view {
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible;
    }
    #pos-right { min-height: 480px; }
    #posCartPanel { height: 480px; }
}
</style>

<div id="pos-view">
    <!-- ══ LEFT: Catálogo de productos ══════════════════════════════════ -->
    <div id="pos-left">
        <div class="pos-section-title">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/></svg>
            Productos
        </div>
        <!-- Filtros -->
        <div class="card mb-3">
            <div class="card-body p-2 p-md-3">
                <div class="d-flex gap-2 mb-2">
                    <input type="text" class="form-control form-control-sm" id="sellProductSearch" placeholder="Nombre o SKU..." autocomplete="off">
                </div>
                <div class="row g-2">
                    <div class="col-4">
                        <select class="form-select form-select-sm" id="sellTypeFilter">
                            <option value="">Tipo</option>
                            <option value="SIMPLE">Simple</option>
                            <option value="COMBO">Combo</option>
                        </select>
                    </div>
                    <div class="col-4">
                        <select class="form-select form-select-sm" id="sellCategoryFilter">
                            <option value="">Categoría</option>
                        </select>
                    </div>
                    <div class="col-4">
                        <select class="form-select form-select-sm" id="sellPresentationFilter">
                            <option value="">Presentación</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <!-- Grid de productos -->
        <div class="row g-2" id="sellProductsGrid">
            <div class="col-12 text-center text-muted py-4">
                <div class="spinner-border spinner-border-sm" role="status"></div>
                <p class="mt-2 small">Cargando productos...</p>
            </div>
        </div>
    </div>

    <!-- ══ RIGHT: Panel de carrito ══════════════════════════════════════ -->
    <div id="pos-right">
        <div id="posCartPanel" class="scm-wrap">
            <!-- HEAD -->
            <div class="scm-head">
                <div class="scm-title">
                    <div class="scm-title-icon">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    </div>
                    Carrito
                    <span class="scm-badge" id="sellCartModalCount">0</span>
                </div>
                <button class="scm-btn-vaciar" id="sellCartModalClear" style="font-size:11px;padding:6px 12px;">
                    <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
                    Vaciar
                </button>
            </div>
            <!-- BODY -->
            <div class="scm-body">
                <!-- Items -->
                <div>
                    <div class="scm-section-lbl">
                        <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/></svg>
                        Productos
                    </div>
                    <div id="sellCartModalItems"></div>
                </div>
                <!-- Campos -->
                <div class="scm-fields">
                    <!-- Método de pago -->
                    <div class="scm-field-group" id="sellCartModalPaymentMethodCol">
                        <label class="scm-field-lbl">Método de Pago</label>
                        <div class="scm-sel" id="scmPagoSel" onclick="toggleScmPagoSel(event)">
                            <span class="scm-sel-val" id="scmPagoVal"><span>💵</span> Efectivo</span>
                            <svg class="scm-sel-arrow" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                            <div class="scm-sel-opts">
                                <div class="scm-sel-opt selected" data-val="CASH"     onclick="scmSelectPago(this,'CASH','💵','Efectivo')"><span>💵</span> Efectivo</div>
                                <div class="scm-sel-opt"          data-val="CARD"     onclick="scmSelectPago(this,'CARD','💳','Tarjeta')"><span>💳</span> Tarjeta</div>
                                <div class="scm-sel-opt"          data-val="TRANSFER" onclick="scmSelectPago(this,'TRANSFER','📲','Transferencia')"><span>📲</span> Transferencia</div>
                                <div class="scm-sel-opt"          data-val="CREDIT"   onclick="scmSelectPago(this,'CREDIT','🏦','Crédito')"><span>🏦</span> Crédito</div>
                            </div>
                        </div>
                        <select id="sellCartModalPaymentMethod" style="display:none" onchange="togglePaymentMethodFieldsModal()">
                            <option value="CASH">Efectivo</option>
                            <option value="CARD">Tarjeta</option>
                            <option value="TRANSFER">Transferencia</option>
                            <option value="CREDIT">Crédito</option>
                        </select>
                    </div>
                    <!-- Campos venta normal -->
                    <div id="sellCartModalNormalSaleFields">
                        <div class="scm-field-group">
                            <label class="scm-field-lbl" id="sellCartModalCustomerLabel">Cliente (Opcional)</label>
                            <div id="sellCartModalCustomerTextContainer">
                                <input type="text" class="scm-inp" id="sellCartModalCustomer" placeholder="Nombre del cliente" autocomplete="off">
                            </div>
                            <div id="sellCartModalCustomerSelectContainer" style="display:none; position:relative;">
                                <div style="display:flex;gap:6px;align-items:center;">
                                    <div class="scm-customer-wrap" style="flex:1;">
                                        <span class="scm-customer-icon"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
                                        <input type="text" class="scm-customer-inp" id="sellCartModalCustomerSearch"
                                               placeholder="Buscar cliente..."
                                               onkeyup="filterCustomersForCredit(this.value); if($('#sellCartModalPaymentMethod').val()==='CREDIT') showCustomersDropdown();"
                                               onfocus="if($('#sellCartModalPaymentMethod').val()==='CREDIT') showCustomersDropdown();"
                                               autocomplete="off">
                                    </div>
                                    <button class="scm-qty-del" type="button" onclick="clearCustomerSelection()" id="clearCustomerBtn" style="display:none;" title="Limpiar">
                                        <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                    </button>
                                    <button class="scm-qty-btn" onclick="showCreateCustomerModal()" type="button" title="Agregar cliente">
                                        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="19" y1="8" x2="23" y2="8"/><line x1="21" y1="6" x2="21" y2="10"/></svg>
                                    </button>
                                </div>
                                <input type="hidden" id="sellCartModalCustomerId" value="">
                                <div id="sellCartModalCustomersList" class="customer-dropdown" style="display:none; position:fixed; z-index:9999; max-height:250px; overflow-y:auto; border:1px solid var(--th-border); border-radius:10px; background:var(--th-surf); box-shadow:0 8px 24px rgba(0,0,0,.35);">
                                    <div class="text-muted text-center py-3" style="font-size:12px;">Cargando clientes...</div>
                                </div>
                            </div>
                        </div>
                        <!-- Referencia transferencia -->
                        <div id="sellCartModalTransferReferenceField" style="display:none" class="scm-field-group">
                            <label class="scm-field-lbl req">Referencia de Transferencia *</label>
                            <input type="text" class="scm-inp" id="sellCartModalTransferReference" placeholder="Número de referencia bancaria">
                        </div>
                        <!-- Campos crédito -->
                        <div id="sellCartModalCreditFields" style="display:none" class="scm-fields-credit">
                            <div class="scm-fields-row">
                                <div class="scm-field-group">
                                    <label class="scm-field-lbl req">Fecha Límite de Pago *</label>
                                    <input type="date" class="scm-inp" id="sellCartModalCreditDueDate" required>
                                </div>
                                <div class="scm-field-group">
                                    <label class="scm-field-lbl">Tasa Interés Diaria (%)</label>
                                    <input type="number" class="scm-inp" id="sellCartModalCreditInterestRate" value="1" step="0.01" min="0" max="100">
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Toggle Grupal -->
                    <div class="scm-grupal-row">
                        <span class="scm-grupal-lbl">
                            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            Venta Grupal
                        </span>
                        <label class="scm-toggle">
                            <input type="checkbox" id="sellCartModalGroupSaleToggle" onchange="toggleGroupSaleModal()">
                            <div class="scm-toggle-track"></div>
                            <div class="scm-toggle-thumb"></div>
                        </label>
                    </div>
                    <!-- Campos venta grupal -->
                    <div id="sellCartModalGroupSaleFields" style="display:none">
                        <div class="scm-field-group" style="position:relative;">
                            <div style="display:flex;align-items:center;gap:8px;">
                                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color:var(--th-text3);flex-shrink:0;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                                <input type="text" class="scm-inp" id="gsSearch" placeholder="Buscar cliente para agregar..." oninput="gsSearchCustomer(this.value)" autocomplete="off" style="flex:1;">
                            </div>
                            <div id="gsDropdown" class="list-group list-group-flush" style="position:absolute;top:100%;left:0;right:0;z-index:1100;max-height:160px;overflow-y:auto;border:1px solid var(--th-border);border-radius:10px;background:var(--th-surf);display:none;box-shadow:0 8px 24px rgba(0,0,0,.35);"></div>
                        </div>
                        <div id="gsParticipantes" style="max-height:220px;overflow-y:auto;margin-top:6px;"></div>
                        <div class="d-flex align-items-center gap-2 mt-2">
                            <button class="scm-btn-cerrar" type="button" onclick="gsDividirIgualmente()" style="flex:0;white-space:nowrap;padding:6px 14px;font-size:11.5px;">
                                <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:3px;vertical-align:middle;"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                                Dividir igualmente
                            </button>
                            <div id="gsValidacion" class="flex-fill text-end" style="font-size:11px;"></div>
                        </div>
                    </div>
                </div>
                <!-- Resumen -->
                <div class="scm-resumen">
                    <div class="scm-resumen-head">
                        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                        Resumen del Pedido
                    </div>
                    <div class="scm-resumen-body">
                        <div class="scm-res-row"><span>Subtotal</span><span id="sellCartModalSubtotal">$0.00</span></div>
                        <div class="scm-res-row tax-row-pos d-none"><span id="sellCartModalTaxLabel">IVA</span><span id="sellCartModalTax">$0.00</span></div>
                        <hr class="scm-res-divider">
                        <div class="scm-res-total">
                            <span class="scm-res-total-lbl">Total</span>
                            <span class="scm-res-total-val" id="sellCartModalTotal">$0.00</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- FOOT -->
            <div class="scm-foot">
                <button class="scm-btn-procesar" id="sellCartModalPay" disabled>
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                    <span id="sellCartModalPayButtonText">Procesar Venta</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
window.initPosView = function() {
    // Ocultar barra inferior del carrito (no necesaria en POS)
    document.body.classList.remove('sell-cart-bar-visible');

    // Cargar productos
    if (typeof loadSellProducts === 'function') loadSellProducts();

    // Actualizar panel del carrito
    if (typeof updateSellCartModal === 'function') updateSellCartModal();
    if (typeof scmSyncPago === 'function') scmSyncPago();
    if (typeof togglePaymentMethodFieldsModal === 'function') togglePaymentMethodFieldsModal();

    // Sincronizar estado de venta grupal
    if (typeof isGroupSale !== 'undefined' && isGroupSale) {
        var tog = document.getElementById('sellCartModalGroupSaleToggle');
        if (tog) tog.checked = true;
        if (typeof toggleGroupSaleModal === 'function') toggleGroupSaleModal();
    }

    // Bindings para filtros de productos (delegados para funcionar en SPA)
    $(document).off('input.pos', '#sellProductSearch').on('input.pos', '#sellProductSearch', function() {
        if (typeof applySellFilters === 'function') {
            clearTimeout(window._posSellSearchTimer);
            window._posSellSearchTimer = setTimeout(applySellFilters, 300);
        }
    });
    $(document).off('change.pos', '#sellTypeFilter, #sellCategoryFilter, #sellPresentationFilter')
        .on('change.pos', '#sellTypeFilter, #sellCategoryFilter, #sellPresentationFilter', function() {
            if (typeof applySellFilters === 'function') applySellFilters();
        });
};
</script>
</div>
