<div id="spa-view-content">
  <div id="credits" class="content-section active">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">
                    <i class="bi bi-credit-card"></i> Créditos
                </h2>
                <button class="btn btn-info" onclick="calculateAllInterests()">
                    <i class="bi bi-calculator"></i> Calcular Intereses
                </button>
            </div>

            <!-- Solicitudes de Pago Pendientes -->
            <div class="card border-warning mb-4" id="paymentRequestsCard" style="display:none">
                <div class="card-header bg-warning bg-opacity-10 d-flex align-items-center justify-content-between">
                    <span class="fw-bold">
                        <i class="bi bi-hourglass-split text-warning me-2"></i>
                        Solicitudes de Pago Pendientes
                        <span class="badge bg-warning text-dark ms-2" id="paymentRequestsBadge">0</span>
                    </span>
                    <small class="text-muted">El cliente reportó un pago en efectivo o transferencia</small>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0" id="paymentRequestsTable">
                            <thead class="table-light">
                                <tr>
                                    <th>Cliente</th>
                                    <th>Monto</th>
                                    <th>Método</th>
                                    <th>Notas</th>
                                    <th>Fecha Solicitud</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="paymentRequestsTbody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Credits Table -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover" id="creditsTable">
                            <thead>
                                <tr>
                                    <th>Cliente</th>
                                    <th>Monto Inicial</th>
                                    <th>Saldo Actual</th>
                                    <th>Intereses</th>
                                    <th>Tasa Normal</th>
                                    <th>Tasa Mora</th>
                                    <th>Fecha Límite</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="9" class="text-center text-muted">
                                        Cargando créditos...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
  <script>
    window.initCreditsView = function() {
      if (typeof loadCredits === 'function') loadCredits();
      if (typeof loadCreditPaymentRequests === 'function') loadCreditPaymentRequests();
    };
  </script>
</div>
