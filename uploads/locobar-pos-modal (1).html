<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOCOBAR – POS Modal</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
[data-theme="dark"] {
  --bg:        #0a0f0f;
  --surf:      #131f1f;
  --surf2:     #192828;
  --surf3:     #1e3030;
  --border:    rgba(45,212,191,.1);
  --border2:   rgba(45,212,191,.26);
  --text:      #e8f5f5;
  --text2:     #6b9e9e;
  --text3:     #334e4e;
  --accent:    #0d9488;
  --accent2:   #2dd4bf;
  --accentbg:  rgba(13,148,136,.1);
  --green:     #34d399; --gbg: rgba(52,211,153,.1);
  --red:       #fb7185; --rbg: rgba(251,113,133,.09);
  --amber:     #fbbf24; --ambg: rgba(251,191,36,.09);
  --hdr:       #080e0e;
  --hborder:   rgba(45,212,191,.11);
  --dash:      rgba(45,212,191,.14);
  --overlay:   rgba(0,0,0,.7);
  --modal-sh:  0 24px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(45,212,191,.12);
  --card-sh:   0 4px 20px rgba(0,0,0,.5), 0 0 0 1px rgba(45,212,191,.1);
  --inp-bg:    rgba(255,255,255,.04);
  --inp-border:rgba(45,212,191,.14);
  --inp-focus: rgba(45,212,191,.3);
}
[data-theme="light"] {
  --bg:        #dde8e8;
  --surf:      #ffffff;
  --surf2:     #f3f9f9;
  --surf3:     #e8f3f3;
  --border:    rgba(13,148,136,.13);
  --border2:   rgba(13,148,136,.32);
  --text:      #0f2020;
  --text2:     #3a7070;
  --text3:     #8ab8b8;
  --accent:    #0d9488;
  --accent2:   #0a7870;
  --accentbg:  rgba(13,148,136,.07);
  --green:     #059669; --gbg: rgba(5,150,105,.08);
  --red:       #e11d48; --rbg: rgba(225,29,72,.08);
  --amber:     #d97706; --ambg: rgba(217,119,6,.08);
  --hdr:       #ffffff;
  --hborder:   rgba(13,148,136,.12);
  --dash:      rgba(13,148,136,.16);
  --overlay:   rgba(0,0,0,.45);
  --modal-sh:  0 24px 60px rgba(13,148,136,.15), 0 0 0 1px rgba(13,148,136,.12);
  --card-sh:   0 2px 12px rgba(13,148,136,.1), 0 0 0 1px rgba(13,148,136,.08);
  --inp-bg:    rgba(13,148,136,.04);
  --inp-border:rgba(13,148,136,.18);
  --inp-focus: rgba(13,148,136,.35);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Outfit',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;
  transition:background .3s,color .3s;
  display:flex;flex-direction:column;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(13,148,136,.016) 1px,transparent 1px),
    linear-gradient(90deg,rgba(13,148,136,.016) 1px,transparent 1px);
  background-size:36px 36px;
}

/* ── TOPBAR ── */
.topbar{
  background:var(--hdr);border-bottom:1px solid var(--hborder);
  height:54px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;position:sticky;top:0;z-index:200;
  box-shadow:0 2px 12px rgba(0,0,0,.25);transition:background .3s;
}
.logo-banner{height:26px;object-fit:contain;}
.topbar-right{display:flex;align-items:center;gap:9px;}
.theme-toggle{display:flex;gap:2px;background:var(--surf2);border:1px solid var(--border);border-radius:20px;padding:3px;}
.th-opt{padding:4px 9px;border-radius:16px;font-size:11px;font-weight:700;color:var(--text3);border:none;background:transparent;font-family:'Outfit',sans-serif;cursor:pointer;transition:all .2s;}
.th-opt.active{background:var(--accent);color:#fff;}

/* ── PAGE BG ── */
.page-preview{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:32px 16px;position:relative;z-index:1;
}

/* ── OVERLAY ── */
.overlay{
  position:fixed;inset:0;background:var(--overlay);
  backdrop-filter:blur(3px);z-index:300;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ── MODAL ── */
.modal{
  background:var(--surf);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--modal-sh);
  width:100%;max-width:580px;
  max-height:90vh;
  display:flex;flex-direction:column;
  overflow:hidden;
  animation:slideUp .25s ease both;
}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Modal header */
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;
  background:rgba(13,148,136,.07);
  border-bottom:1.5px dashed var(--dash);
  flex-shrink:0;
}
.modal-title{
  display:flex;align-items:center;gap:10px;
  font-size:15px;font-weight:800;color:var(--text);
}
.modal-title-icon{
  width:32px;height:32px;border-radius:9px;
  background:var(--accentbg);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent2);flex-shrink:0;
}
.cart-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;border-radius:7px;padding:0 5px;
  background:var(--accent);color:#fff;
  font-size:11px;font-weight:800;
  font-family:'JetBrains Mono',monospace;
}
.close-btn{
  width:30px;height:30px;border-radius:8px;
  background:var(--surf2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--text2);cursor:pointer;transition:all .14s;
}
.close-btn:hover{background:var(--rbg);border-color:rgba(251,113,133,.3);color:var(--red);}

/* Modal body — scrollable */
.modal-body{
  flex:1;overflow-y:auto;padding:16px 20px;
  display:flex;flex-direction:column;gap:14px;
}
.modal-body::-webkit-scrollbar{width:4px;}
.modal-body::-webkit-scrollbar-track{background:transparent;}
.modal-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* ── CART ITEMS ── */
.section-label{
  display:flex;align-items:center;gap:7px;
  font-size:10px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text3);
  margin-bottom:6px;
}

.cart-item{
  display:flex;align-items:center;gap:12px;
  background:var(--surf2);
  border:1px solid var(--border);
  border-radius:12px;padding:10px 12px;
  box-shadow:var(--card-sh);
  transition:border-color .15s;
}
.cart-item:hover{border-color:var(--border2);}

.item-img{
  width:52px;height:52px;flex-shrink:0;border-radius:9px;
  background:var(--surf3);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--text3);overflow:hidden;
}
.item-img img{width:100%;height:100%;object-fit:cover;}

.item-info{flex:1;min-width:0;}
.item-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-unit{font-size:10.5px;color:var(--text3);}
.item-price{
  font-size:14px;font-weight:800;
  font-family:'JetBrains Mono',monospace;
  color:var(--accent2);margin-top:3px;
}

.qty-block{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.qty-del{
  width:28px;height:28px;border-radius:7px;
  background:var(--rbg);border:1px solid rgba(251,113,133,.2);
  display:flex;align-items:center;justify-content:center;
  color:var(--red);cursor:pointer;transition:all .14s;
}
.qty-del:hover{background:var(--red);color:#fff;border-color:var(--red);}
.qty-btn{
  width:28px;height:28px;border-radius:7px;
  background:var(--surf3);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--text2);cursor:pointer;transition:all .14s;
}
.qty-btn:hover{background:var(--accentbg);border-color:var(--accent);color:var(--accent2);}
.qty-btn:active{transform:scale(.92);}
.qty-num{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;font-weight:700;color:var(--text);
  min-width:18px;text-align:center;
}
.item-line-total{
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;font-weight:700;color:var(--text);
  min-width:48px;text-align:right;flex-shrink:0;
}

/* ── VENTA GRUPAL ── */
/* ── FIELDS SECTION (always visible) ── */
.fields-section{
  background:var(--surf2);
  border:1px solid var(--border);
  border-radius:12px;padding:12px 14px;
  display:flex;flex-direction:column;gap:10px;
}
.fields-row{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.field-group{display:flex;flex-direction:column;gap:4px;}
.field-lbl{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);}
.field-inp{
  background:var(--inp-bg);
  border:1px solid var(--inp-border);
  border-radius:9px;padding:8px 12px;
  font-size:12.5px;color:var(--text);
  font-family:'Outfit',sans-serif;
  outline:none;transition:border-color .15s,box-shadow .15s;
  width:100%;
}
.field-inp::placeholder{color:var(--text3);}
.field-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--inp-focus);}
.custom-sel{
  position:relative;
  background:var(--inp-bg);
  border:1px solid var(--inp-border);
  border-radius:9px;padding:8px 36px 8px 12px;
  font-size:12.5px;color:var(--text);
  cursor:pointer;user-select:none;
  transition:border-color .15s,box-shadow .15s;
}
.custom-sel:hover{border-color:var(--border2);}
.custom-sel.open{border-color:var(--accent);box-shadow:0 0 0 3px var(--inp-focus);}
.custom-sel-val{display:flex;align-items:center;gap:7px;}
.custom-sel-arrow{
  position:absolute;right:11px;top:50%;transform:translateY(-50%);
  color:var(--text3);transition:transform .2s;pointer-events:none;
}
.custom-sel.open .custom-sel-arrow{transform:translateY(-50%) rotate(180deg);}
.custom-sel-opts{
  display:none;
  position:absolute;top:calc(100% + 5px);left:0;right:0;
  background:var(--surf);border:1px solid var(--border2);
  border-radius:10px;overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:200;
}
.custom-sel.open .custom-sel-opts{display:block;}
.custom-sel-opt{
  display:flex;align-items:center;gap:8px;
  padding:9px 13px;font-size:12.5px;color:var(--text);
  cursor:pointer;transition:background .12s;
}
.custom-sel-opt:hover{background:var(--accentbg);color:var(--accent2);}
.custom-sel-opt.selected{color:var(--accent2);font-weight:700;}

/* ── VENTA GRUPAL toggle row ── */
.grupal-row{
  display:flex;align-items:center;gap:10px;
  padding-top:2px;
  border-top:1px dashed var(--dash);
}
.grupal-lbl{font-size:12.5px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px;flex:1;}
.grupal-lbl svg{color:var(--accent2);}

/* Toggle switch */
.toggle{position:relative;width:38px;height:22px;flex-shrink:0;cursor:pointer;}
.toggle input{opacity:0;width:0;height:0;position:absolute;}
.toggle-track{
  position:absolute;inset:0;border-radius:11px;
  background:var(--surf3);border:1px solid var(--border);
  transition:background .2s,border-color .2s;
}
.toggle input:checked ~ .toggle-track{background:var(--accent);border-color:var(--accent);}
.toggle-thumb{
  position:absolute;top:3px;left:3px;
  width:14px;height:14px;border-radius:7px;background:#fff;
  transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.25);
}
.toggle input:checked ~ .toggle-thumb{transform:translateX(16px);}

/* Cliente search — shown when grupal is ON */
.cliente-wrap{
  overflow:hidden;max-height:0;opacity:0;
  transition:max-height .25s ease,opacity .2s;
  position:relative;
}
.cliente-wrap.open{max-height:120px;opacity:1;}
.cliente-search-wrap{position:relative;}
.cliente-search-icon{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--text3);pointer-events:none;display:flex;
}
.cliente-inp{
  background:var(--inp-bg);
  border:1px solid var(--inp-border);
  border-radius:9px;padding:8px 12px 8px 34px;
  font-size:12.5px;color:var(--text);
  font-family:'Outfit',sans-serif;
  outline:none;transition:border-color .15s,box-shadow .15s;
  width:100%;
}
.cliente-inp::placeholder{color:var(--text3);}
.cliente-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--inp-focus);}

/* Autocomplete dropdown */
.cliente-dropdown{
  position:absolute;top:calc(100% + 4px);left:0;right:0;
  background:var(--surf);border:1px solid var(--border2);
  border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);
  z-index:100;overflow:hidden;
  display:none;
}
.cliente-dropdown.visible{display:block;}
.cliente-opt{
  display:flex;align-items:center;gap:9px;
  padding:8px 12px;cursor:pointer;
  transition:background .12s;
  font-size:12.5px;color:var(--text);
}
.cliente-opt:hover{background:var(--accentbg);}
.cliente-opt-av{
  width:26px;height:26px;border-radius:7px;flex-shrink:0;
  background:var(--accentbg);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:var(--accent2);
}
.cliente-opt-name{font-weight:600;}
.cliente-opt-sub{font-size:10.5px;color:var(--text3);}

/* ── RESUMEN ── */
.resumen{
  background:var(--surf2);
  border:1px solid var(--border);
  border-radius:12px;overflow:hidden;
}
.resumen-head{
  background:rgba(13,148,136,.07);
  border-bottom:1.5px dashed var(--dash);
  padding:9px 14px;
  display:flex;align-items:center;gap:7px;
  font-size:12px;font-weight:800;color:var(--text);
}
.resumen-body{padding:10px 14px;}
.res-row{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;color:var(--text2);padding:3px 0;
}
.res-row span:last-child{font-family:'JetBrains Mono',monospace;font-weight:600;}
.res-row.discount span:last-child{color:var(--green);}
.res-divider{border:none;border-top:1.5px dashed var(--dash);margin:6px 0;}
.res-total{
  display:flex;justify-content:space-between;align-items:center;
  padding:4px 0 2px;
}
.res-total-lbl{font-size:13px;font-weight:800;color:var(--text);}
.res-total-val{
  font-size:22px;font-weight:900;
  font-family:'JetBrains Mono',monospace;
  color:var(--accent2);line-height:1;
}

/* ── MODAL FOOTER ── */
.modal-foot{
  padding:14px 20px;
  border-top:1.5px dashed var(--dash);
  display:flex;align-items:center;gap:10px;
  flex-shrink:0;background:var(--surf);
}
.btn-vaciar{
  display:flex;align-items:center;gap:6px;
  padding:9px 16px;border-radius:10px;
  background:var(--rbg);border:1px solid rgba(251,113,133,.25);
  font-size:12px;font-weight:700;font-family:'Outfit',sans-serif;
  color:var(--red);cursor:pointer;transition:all .14s;
  white-space:nowrap;flex-shrink:0;
}
.btn-vaciar:hover{background:var(--red);color:#fff;border-color:var(--red);}
.btn-cerrar{
  flex:1;
  padding:9px 16px;border-radius:10px;
  background:var(--surf2);border:1px solid var(--border);
  font-size:12.5px;font-weight:700;font-family:'Outfit',sans-serif;
  color:var(--text2);cursor:pointer;transition:all .14s;
  text-align:center;
}
.btn-cerrar:hover{border-color:var(--border2);color:var(--text);}
.btn-procesar{
  flex:1;
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 20px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#0f766e);
  border:none;color:#fff;
  font-size:13px;font-weight:800;font-family:'Outfit',sans-serif;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(13,148,136,.35);
  transition:opacity .15s,transform .12s,box-shadow .15s;
  white-space:nowrap;
}
.btn-procesar:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 6px 20px rgba(13,148,136,.45);}
.btn-procesar:active{transform:scale(.98);}

/* Empty state */
.cart-empty{
  text-align:center;padding:32px 20px;
}
.empty-icon{width:48px;height:48px;border-radius:13px;background:var(--accentbg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--accent2);margin:0 auto 10px;}
.empty-t{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:4px;}
.empty-s{font-size:11.5px;color:var(--text3);}

.field-lbl-row{display:flex;justify-content:space-between;align-items:center;}
.field-req{font-size:9px;font-weight:700;color:var(--amber);background:var(--ambg);border-radius:4px;padding:1px 5px;letter-spacing:.06em;}
.grupal-count{font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--accent2);}
.cliente-tags{display:flex;flex-wrap:wrap;gap:5px;}
.cliente-tags:not(:empty){margin-bottom:4px;}
.cliente-tag{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--accentbg);border:1px solid var(--border2);
  border-radius:20px;padding:4px 8px 4px 6px;
  font-size:11.5px;font-weight:600;color:var(--accent2);
}
.tag-av{
  width:18px;height:18px;border-radius:5px;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;flex-shrink:0;
}
.tag-del{
  width:14px;height:14px;border-radius:50%;
  background:rgba(251,113,133,.15);border:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--red);cursor:pointer;font-size:11px;line-height:1;
  transition:background .12s;padding:0;font-family:sans-serif;
}
.tag-del:hover{background:var(--red);color:#fff;}
.grupal-hint{
  display:none;align-items:center;gap:5px;
  font-size:10.5px;color:var(--amber);margin-top:6px;
}
.grupal-hint.show{display:flex;}
.btn-procesar:disabled{
  opacity:.4;cursor:not-allowed;transform:none !important;box-shadow:none !important;
}
</style>
</head>

            <div class="cliente-search-wrap">
              <span class="cliente-search-icon">
                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </span>
              <input class="cliente-inp" id="clienteInp" type="text" placeholder="Nombre o cédula…" oninput="searchCliente(this.value,'clienteDropdown')" autocomplete="off">
              <div class="cliente-dropdown" id="clienteDropdown"></div>
            </div>
          </div>
        </div>

        <!-- Venta Grupal toggle -->
        <div class="grupal-row">
          <span class="grupal-lbl">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Venta Grupal
          </span>
          <label class="toggle">
            <input type="checkbox" id="grupalToggle" onchange="toggleGrupal(this)">
            <div class="toggle-track"></div>
            <div class="toggle-thumb"></div>
          </label>
        </div>

        <!-- Clientes múltiples — visible cuando grupal está ON -->
        <div class="cliente-wrap" id="clienteGrupal">
          <div class="field-group">
            <div class="field-lbl-row">
              <label class="field-lbl">Clientes del Grupo <span class="field-req">mín. 2</span></label>
              <span class="grupal-count" id="grupalCount">0 agregados</span>
            </div>
            <!-- Tags de clientes seleccionados -->
            <div class="cliente-tags" id="clienteTags"></div>
            <!-- Buscador -->
            <div class="cliente-search-wrap" style="margin-top:6px;">
              <span class="cliente-search-icon">
                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </span>
              <input class="cliente-inp" id="clienteInpG" type="text" placeholder="Agregar cliente al grupo…" oninput="searchCliente(this.value,'clienteDropdownG')" autocomplete="off">
              <div class="cliente-dropdown" id="clienteDropdownG"></div>
            </div>
            <!-- Aviso si faltan clientes -->
            <div class="grupal-hint" id="grupalHint">
              <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              Agrega al menos 2 clientes para procesar la venta grupal
            </div>
          </div>
        </div>

      </div>

      <!-- Resumen -->
      <div class="resumen">
        <div class="resumen-head">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Resumen del Pedido
        </div>
        <div class="resumen-body">
          <div class="res-row"><span>Subtotal</span><span id="resSubtotal">$0.00</span></div>
          <div class="res-row discount" id="resDiscRow" style="display:none">
            <span>Descuento (5%)</span><span id="resDisc">-$0.00</span>
          </div>
          <hr class="res-divider">
          <div class="res-total">
            <span class="res-total-lbl">Total</span>
            <span class="res-total-val" id="resTotal">$0.00</span>
          </div>
        </div>
      </div>

    </div><!-- /body -->

    <!-- FOOT -->
    <div class="modal-foot">
      <button class="btn-vaciar" onclick="clearCart()">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        Vaciar
      </button>
      
      <button class="btn-procesar">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        Procesar Venta
      </button>
    </div>

  </div>
</div>

<script>
// ── MÉTODO DE PAGO CUSTOM SELECT ──
function togglePagoSel(){
  document.getElementById('pagoSel').classList.toggle('open');
}
function selectPago(el, icon, label){
  document.getElementById('pagoVal').innerHTML = `<span>${icon}</span> ${label}`;
  document.querySelectorAll('.custom-sel-opt').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('pagoSel').classList.remove('open');
}
document.addEventListener('click', e=>{
  if(!e.target.closest('#pagoSel'))
    document.getElementById('pagoSel')?.classList.remove('open');
});

// ── THEME ──
function setTheme(t,btn){
  document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('.th-opt').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

// ── CART DATA ──
let cart = [
  {id:1, name:'Chifles de Papa', unit:'Unidad', unitPrice:.75, qty:1},
  {id:2, name:'Heineken 269ml', unit:'Lata', unitPrice:2.50, qty:2},
  {id:3, name:'Ron Bacardi 750ml', unit:'Botella', unitPrice:28.99, qty:1},
];

function renderCart(){
  const el = document.getElementById('cartItems');
  document.getElementById('cartBadge').textContent = cart.reduce((s,i)=>s+i.qty,0);

  if(!cart.length){
    el.innerHTML=`<div class="cart-empty">
      <div class="empty-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div>
      <div class="empty-t">Carrito vacío</div>
      <div class="empty-s">Agrega productos para continuar</div>
    </div>`;
    updateResumen(); return;
  }

  el.innerHTML = cart.map(item=>`
    <div class="cart-item" id="ci-${item.id}">
      <div class="item-img">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 9 4-4 4 4 4-4 4 4"/><circle cx="8" cy="14" r="2"/></svg>
      </div>
      <div class="item-info">
        <div class="item-name">${item.name}</div>
        <div class="item-unit">${item.unit}</div>
        <div class="item-price">$${item.unitPrice.toFixed(2)}</div>
      </div>
      <div class="qty-block">
        ${item.qty===1
          ? `<button class="qty-del" onclick="removeItem(${item.id})"><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>`
          : `<button class="qty-btn" onclick="changeQty(${item.id},-1)"><svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>`
        }
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="changeQty(${item.id},1)">
          <svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <span class="item-line-total">$${(item.unitPrice*item.qty).toFixed(2)}</span>
    </div>
  `).join('');
  updateResumen();
}

function changeQty(id,d){
  const item=cart.find(i=>i.id===id); if(!item)return;
  item.qty=Math.max(1,item.qty+d); renderCart();
}
function removeItem(id){
  const el=document.getElementById('ci-'+id);
  if(el){el.style.opacity='0';el.style.transform='translateX(12px)';el.style.transition='all .18s';}
  setTimeout(()=>{cart=cart.filter(i=>i.id!==id);renderCart();},180);
}
function clearCart(){cart=[];renderCart();}

function updateResumen(){
  const sub=cart.reduce((s,i)=>s+i.unitPrice*i.qty,0);
  document.getElementById('resSubtotal').textContent='$'+sub.toFixed(2);
  document.getElementById('resTotal').textContent='$'+sub.toFixed(2);
}

function toggleGrupal(cb){
  document.getElementById('clienteSimple').classList.toggle('open', !cb.checked);
  document.getElementById('clienteGrupal').classList.toggle('open',  cb.checked);
  if(!cb.checked){ grupalClientes=[]; renderTags(); }
  updateProcesar();
}

// ── CLIENTE ÚNICO ──
function searchCliente(q, ddId){
  const dd = document.getElementById(ddId);
  const isGrupal = ddId === 'clienteDropdownG';
  if(!q.trim()){ dd.classList.remove('visible'); return; }
  const matches = CLIENTES.filter(c =>
    c.name.toLowerCase().includes(q.toLowerCase()) || c.sub.includes(q)
  ).filter(c => !isGrupal || !grupalClientes.find(g=>g.name===c.name));
  if(!matches.length){ dd.classList.remove('visible'); return; }
  dd.innerHTML = matches.map(c=>`
    <div class="cliente-opt" onclick="${isGrupal ? `addGrupalCliente('${c.name}','${c.sub}')` : `selectCliente('${c.name}')`}">
      <div class="cliente-opt-av">${c.name.charAt(0)}</div>
      <div>
        <div class="cliente-opt-name">${c.name}</div>
        <div class="cliente-opt-sub">${c.sub}</div>
      </div>
    </div>`).join('');
  dd.classList.add('visible');
}

function selectCliente(name){
  document.getElementById('clienteInp').value = name;
  document.getElementById('clienteDropdown').classList.remove('visible');
}

// ── CLIENTES GRUPALES ──
let grupalClientes = [];

function addGrupalCliente(name, sub){
  if(grupalClientes.find(c=>c.name===name)) return;
  grupalClientes.push({name, sub});
  document.getElementById('clienteInpG').value = '';
  document.getElementById('clienteDropdownG').classList.remove('visible');
  renderTags();
  updateProcesar();
}

function removeGrupalCliente(name){
  grupalClientes = grupalClientes.filter(c=>c.name!==name);
  renderTags();
  updateProcesar();
}

function renderTags(){
  const wrap = document.getElementById('clienteTags');
  const count = document.getElementById('grupalCount');
  const hint  = document.getElementById('grupalHint');
  count.textContent = grupalClientes.length + ' agregado' + (grupalClientes.length!==1?'s':'');
  wrap.innerHTML = grupalClientes.map(c=>`
    <div class="cliente-tag">
      <div class="tag-av">${c.name.charAt(0)}</div>
      ${c.name}
      <button class="tag-del" onclick="removeGrupalCliente('${c.name}')">×</button>
    </div>`).join('');
  hint.classList.toggle('show', grupalClientes.length < 2);
}

function updateProcesar(){
  const isGrupal = document.getElementById('grupalToggle').checked;
  const ok = !isGrupal || grupalClientes.length >= 2;
  document.querySelector('.btn-procesar').disabled = !ok;
}

document.addEventListener('click', e=>{
  if(!e.target.closest('.cliente-search-wrap')){
    document.querySelectorAll('.cliente-dropdown').forEach(d=>d.classList.remove('visible'));
  }
});

renderCart();
updateProcesar();

const CLIENTES = [
  {name:'Roger Burgos',    sub:'0912345678'},
  {name:'María Torres',    sub:'0987654321'},
  {name:'Carlos Mendoza',  sub:'0923456789'},
  {name:'Ana Lucía Vega',  sub:'0934567890'},
  {name:'Juan Pablo Ríos', sub:'0945678901'},
];

function closeModal(){
  document.getElementById('overlay').style.opacity='0';
  document.getElementById('overlay').style.transition='opacity .2s';
  setTimeout(()=>document.getElementById('overlay').style.display='none',200);
}
</script>
</body>
</html>
